version: '3.8'

services:
  agente:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./restaurante:/app/restaurante
      - ./plantillas:/app/plantillas
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Evolution API para WhatsApp (opcional)
  evolution:
    image: atendai/evolution-api:latest
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=https://evo.yourserver.com
      - AUTHENTICATION_API_KEY=tu_api_key
    volumes:
      - evolution_data:/evolution/store
    restart: unless-stopped

volumes:
  evolution_data:
