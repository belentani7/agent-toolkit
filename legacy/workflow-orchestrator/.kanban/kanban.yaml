### WIP Limits
- P0-Critical: 2 tasks max
- P1-High: 3 tasks max
- In Progress: 2 tasks max
- Validating: 1 task max

### Daily Check
- Run `python src/monitor.py` - health check
- Review `.kanban/` - update statuses
- Check `src/agentguard.py` - budget status
- Check `pendingActions` - stale items
