name: codeql
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          # Lenguajes dominantes del archivo (1236 ficheros .py, 1040 .js/.ts).
          # Go (9 ficheros) y Java (2) se omiten: Java requiere paso de build
          # (autobuild) y ambos son residuales en legacy/.
          languages: python, javascript
      - uses: github/codeql-action/analyze@v3
